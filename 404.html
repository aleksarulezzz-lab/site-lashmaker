<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Александра Рулева</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0806">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:#0c0806;color:#f4e9d6;text-align:center;padding:32px;
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  }
  .code{
    font-size:clamp(64px,16vw,140px);font-weight:700;font-style:italic;line-height:1;
    color:transparent;background:linear-gradient(115deg,#c9a24a,#f6dfa0,#c9a24a);
    -webkit-background-clip:text;background-clip:text;margin:0;
  }
  h1{font-size:clamp(20px,3vw,26px);font-weight:400;font-style:italic;margin:14px 0 6px;}
  p{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;color:#b3a084;line-height:1.6;margin:0 0 28px;max-width:420px;}
  .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  a{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    text-decoration:none;color:#c9a24a;border:1px solid rgba(201,162,74,.4);
    padding:12px 22px;border-radius:999px;transition:background .2s,color .2s;
  }
  a:hover{background:#c9a24a;color:#1a1006;}
</style>
</head>
<body>
  <p class="code">404</p>
  <h1>Такой страницы здесь нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка.</p>
  <div class="links">
    <a href="/lashmaker/">На сайт-демо</a>
    <a href="/">На главную</a>
  </div>
</body>
</html>
