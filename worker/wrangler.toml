name = "lashmaker-booking"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "lashmaker-bookings"
database_id = "ab4289b3-b8af-4752-8b99-cfefd1645758"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "a2f41f7531dd45788fcfc0ecb8e8f508"

[triggers]
# */5 * * * * -- reminder sweep, every 5 minutes.
# 0 17 * * *  -- evening site-stats summary, 20:00 Moscow (UTC+3, fixed).
crons = ["*/5 * * * *", "0 17 * * *"]

[vars]
# Set once the Telegram bot exists -- its public @username, used to build
# the client-facing confirmation deep link (t.me/<username>?start=confirm_<token>).
# Booking still works with this unset; the confirm link/reminder feature is
# simply inactive (confirmUrl comes back null) until it's filled in.
BOT_USERNAME = "Your_lash_maker_bot"

# Public domain, used for the daily report header and the "site is up" ping.
SITE_DOMAIN = "aleksarulezzz.ru"
